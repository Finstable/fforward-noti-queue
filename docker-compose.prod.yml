# docker compose file for development environment (nest.js)
name: ff-noti-dev
services:
  nest-app:
    container_name: ff-noti-queue
    build:
      context: .
      dockerfile: Dockerfile.prod
    volumes:
      - ./src:/app/src
    command: npm run start:prod
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000} # Default to port 3000 if PORT is not set
    ports:
      - '${PORT}:${PORT}'
